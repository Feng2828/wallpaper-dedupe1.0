plugins {
    id 'com.android.application'
}

android {
    namespace 'com.workbuddy.wallpapergedupe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.workbuddy.wallpapergedupe'
        minSdk 26          // Android 8.0，Redmi K60E / HyperOS 2 完全覆盖
        targetSdk 34       // Android 14；避开 35 的强制边到边适配
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // 不启用 R8，保证纯 Java 反射/资源引用零风险
            minifyEnabled false
            shrinkResources false
            debuggable false
            // 复用 AGP 自动生成的 debug 签名，使 release 包也能直接安装（自用分发）
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 唯一第三方依赖：分组/缩略图列表。其余全部使用 Android 原生 API。
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
