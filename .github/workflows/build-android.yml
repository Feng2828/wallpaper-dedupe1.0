name: Build Wallpaper-Dedupe Debug APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 先读取gradle版本，自动下载对应gradle-wrapper.jar
        id: get_gradle_version
        run: |
          VERSION=$(grep -oP 'gradle-[0-9.]+' gradle/wrapper/gradle-wrapper.properties | cut -d'-' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: 下载gradle-wrapper.jar补齐
        run: |
          curl -fL -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v${{ steps.get_gradle_version.outputs.VERSION }}/gradle/wrapper/gradle-wrapper.jar
      - name: 给gradlew权限
        run: chmod +x gradlew
      - name: 编译Debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-dedupe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
