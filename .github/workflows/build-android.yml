name: Build Wallpaper-Dedupe Debug APK
on:
  push:
  workflow_dispatch: # 支持手动点按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（Android Gradle推荐）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 给gradlew增加执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传编译好的APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-dedupe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
