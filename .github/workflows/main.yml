name: Build Wallpaper-Dedupe Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK 与 sdkmanager，无需额外安装命令行工具。
      # 注意：不要再引入 android-actions 的 setup-android v3，它会安装已下架的 tools 包导致失败。
      - name: 检查 Android SDK 并按需安装构建平台
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(command -v sdkmanager 2>/dev/null || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER" || true
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
            echo "[sdk] 平台检查完成"
          else
            echo "[sdk] 未找到 sdkmanager，直接使用 runner 预装 SDK"
          fi
          echo "--- 已安装的平台 ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      # gradle-wrapper.jar 是二进制文件，未随源码上传。
      # 先在仓库里找；找不到就从 Gradle 官方仓库下载并校验。
      # 若下载也失败，降级为直接下载完整 Gradle 8.7 发行版。
      - name: 准备 Gradle Wrapper
        shell: bash
        run: |
          set -e
          mkdir -p gradle/wrapper
          JAR=gradle/wrapper/gradle-wrapper.jar
          # 若 jar 被误传到嵌套目录（gradle/wrapper/gradle/wrapper/），挪回正确位置
          if [ ! -s "$JAR" ] && [ -s gradle/wrapper/gradle/wrapper/gradle-wrapper.jar ]; then
            cp gradle/wrapper/gradle/wrapper/gradle-wrapper.jar "$JAR"
            echo "[gradle] 已从嵌套目录修正 jar 位置"
          fi
          if [ ! -s "$JAR" ]; then
            curl -fsSL --retry 3 -o "$JAR" \
              https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          if [ -s "$JAR" ] && \
             unzip -l "$JAR" 2>/dev/null | grep -q 'GradleWrapperMain.class'; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "[gradle] 使用仓库内的 Gradle Wrapper"
          else
            echo "[gradle] Wrapper 不可用，下载完整 Gradle 8.7 发行版"
            rm -f "$JAR"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
            chmod +x "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin/gradle"
            echo "GRADLE_CMD=$RUNNER_TEMP/gradle-dist/gradle-8.7/bin/gradle" >> "$GITHUB_ENV"
          fi

      - name: 编译 Debug APK
        shell: bash
        run: |
          $GRADLE_CMD assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-dedupe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
